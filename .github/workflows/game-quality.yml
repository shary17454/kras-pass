name: Game Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      balance_campaign:
        description: Run the full natural-round balance campaign instead of the networking matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: game-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    if: github.event_name == 'workflow_dispatch' && inputs.balance_campaign
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/balance-campaign.yml

  godot:
    if: github.event_name != 'workflow_dispatch' || !inputs.balance_campaign
    name: ${{ matrix.scenario == 'core' && 'godot' || format('network-{0}', matrix.scenario) }}
    runs-on: ubuntu-24.04
    # Colossus runs two ordinary (450s) and two tournament (800s) peer groups.
    # Kart: 2 x 960s ordinary + 3 x 1740s tournament/final + 10m setup < 130m.
    # Fawda: 3 x 180s ordinary + 4 x 360s tournament + 10m setup < 45m.
    timeout-minutes: ${{ matrix.scenario == 'sabaq_sawarikh' && 90 || matrix.scenario == 'boss_colossus' && 50 || matrix.scenario == 'kart_sprint' && 130 || matrix.scenario == 'lab_crates' && 85 || matrix.scenario == 'fawda' && 45 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [core, ring_rumble, goal_guard, gem_grab, star_rush, zone_hold, relic_hold, tag_hunt, paint_grid, mnatiq, mukharrib, magnet_court, storm_heart, sky_court, crumble_court, blast_ball, color_stand, quick_draw, symbol_echo, crate_smash, lab_crates, crate_relay, hurdle_dash, rising_tide, sweeper_storm, duel_pit, bumper_bowl, duo_clash, drift_floes, turret_duel, tank_arena, scrap_karts, fawda, kart_sprint, sabaq_sawarikh, base_siege, boss_forge, boss_dreadnought, boss_sovereign, boss_colossus]
    env:
      GODOT_VERSION: 4.7.1
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified Godot binary
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --max-time 300 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import assets and class cache
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --log-file "$RUNNER_TEMP/godot-import.log" --import \
            -- --test-data-dir="$RUNNER_TEMP/kras-import" 2>&1 | tee "$RUNNER_TEMP/godot-import.stdout"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|Error importing|ERROR:' "$RUNNER_TEMP/godot-import.stdout"; then
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Server tests
        if: matrix.scenario == 'core'
        working-directory: server
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test 2>&1 | tee "$RUNNER_TEMP/kras-server-tests.stdout"
      - name: Real multi-engine networking checks
        if: matrix.scenario != 'core'
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}
          GAME_ID: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          match_args=()
          if [ "$GAME_ID" = kart_sprint ]; then
            match_args+=(--seed=439903641)
          fi
          if [ "$GAME_ID" = fawda ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --humans=4 --seed=1528023384 2>&1 | tee "$RUNNER_TEMP/kras-network-fawda-missing-explosion.stdout"
          fi
          node network-smoke.js --game="$GAME_ID" "${match_args[@]}" 2>&1 | tee "$RUNNER_TEMP/kras-network-match.stdout"
          node network-smoke.js --game="$GAME_ID" --tournament 2>&1 | tee "$RUNNER_TEMP/kras-network-tournament.stdout"
          if [ "$GAME_ID" = lab_crates ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --humans=4 --seed=1366831714 2>&1 | tee "$RUNNER_TEMP/kras-network-lab-simulation-input-regression.stdout"
            node network-smoke.js --game="$GAME_ID" --humans=4 --seed=1302046270 2>&1 | tee "$RUNNER_TEMP/kras-network-lab-natural-round-regression.stdout"
          fi
          if [ "$GAME_ID" = zone_hold ]; then
            node network-smoke.js --game="$GAME_ID" --seed=438683058 2>&1 | tee "$RUNNER_TEMP/kras-network-zone-contest-regression.stdout"
          fi
          if [ "$GAME_ID" = fawda ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --humans=2 --seed=1846961932 2>&1 | tee "$RUNNER_TEMP/kras-network-fawda-pursuit-regression.stdout"
            node network-smoke.js --game="$GAME_ID" --humans=4 --seed=1846961932 2>&1 | tee "$RUNNER_TEMP/kras-network-fawda-four-player-regression.stdout"
          fi
          if [ "$GAME_ID" = hurdle_dash ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --humans=2 --seed=1032434731 2>&1 | tee "$RUNNER_TEMP/kras-network-hurdle-regression.stdout"
            node network-smoke.js --game="$GAME_ID" --humans=4 --seed=1032434731 2>&1 | tee "$RUNNER_TEMP/kras-network-hurdle-four-player.stdout"
          fi
          if [ "$GAME_ID" = duo_clash ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --duo-tiebreak 2>&1 | tee "$RUNNER_TEMP/kras-network-team-final.stdout"
          fi
          if [ "$GAME_ID" = kart_sprint ] || [ "$GAME_ID" = sabaq_sawarikh ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --race-tiebreak --humans=4 2>&1 | tee "$RUNNER_TEMP/kras-network-race-final.stdout"
          fi
          if [ "$GAME_ID" = base_siege ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --siege-tiebreak --humans=4 2>&1 | tee "$RUNNER_TEMP/kras-network-siege-final.stdout"
          fi
          if [ "$GAME_ID" = boss_forge ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --forge-tiebreak --humans=4 2>&1 | tee "$RUNNER_TEMP/kras-network-forge-final.stdout"
          fi
          if [ "$GAME_ID" = boss_dreadnought ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --dread-tiebreak --humans=4 --seed=9614 2>&1 | tee "$RUNNER_TEMP/kras-network-dreadnought-final.stdout"
          fi
          if [ "$GAME_ID" = boss_sovereign ]; then
            node network-smoke.js --game="$GAME_ID" --tournament --sovereign-tiebreak --humans=4 --seed=9614 2>&1 | tee "$RUNNER_TEMP/kras-network-sovereign-final.stdout"
          fi
      - name: Compile, content, regression and cleanup checks
        if: matrix.scenario == 'core'
        env:
          TMPDIR: ${{ runner.temp }}
          KRAS_STABILITY_CYCLES: '3'
        run: |
          python3 -m unittest discover -s tests -p test_ios_export_evidence.py -v
          bash -n ci_scripts/prepare_ios_tools.sh ci_scripts/export_current_ios.sh tools/export_ios.sh
          sh tests/check_party_wrapper.sh
          sh tools/check_party.sh
      - name: Validate server schema against actual Godot capture
        if: matrix.scenario == 'core'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/armed-world.json)
          siege_captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/siege-world.json)
          forge_captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/forge-world.json)
          dreadnought_captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/dreadnought-world.json)
          sovereign_captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/sovereign-world.json)
          colossus_captures=("$RUNNER_TEMP"/kras-party-check.*/saves-tests/colossus-world.json)
          if [ "${#captures[@]}" -ne 1 ] || [ "${#siege_captures[@]}" -ne 1 ] || [ "${#forge_captures[@]}" -ne 1 ] || [ "${#dreadnought_captures[@]}" -ne 1 ] || [ "${#sovereign_captures[@]}" -ne 1 ] || [ "${#colossus_captures[@]}" -ne 1 ]; then
            echo "Expected exactly one Godot capture for each world schema" >&2
            exit 1
          fi
          KRAS_ARMED_WORLD_FIXTURE="${captures[0]}" KRAS_SIEGE_WORLD_FIXTURE="${siege_captures[0]}" KRAS_FORGE_WORLD_FIXTURE="${forge_captures[0]}" KRAS_DREADNOUGHT_WORLD_FIXTURE="${dreadnought_captures[0]}" KRAS_SOVEREIGN_WORLD_FIXTURE="${sovereign_captures[0]}" KRAS_COLOSSUS_WORLD_FIXTURE="${colossus_captures[0]}" npm test 2>&1 | tee "$RUNNER_TEMP/kras-server-capture-tests.stdout"
      - name: Record QA source
        if: always()
        shell: bash
        env:
          QA_SCENARIO: ${{ matrix.scenario }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const evidence = {
            schema_version: 1,
            checkout_commit: git('rev-parse', 'HEAD'),
            checkout_tree: git('rev-parse', 'HEAD^{tree}'),
            intended_head: process.env.QA_HEAD_SHA,
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            scenario: process.env.QA_SCENARIO,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            tracked_changes: git('status', '--porcelain', '--untracked-files=no'),
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'kras-qa-source.json'),
            JSON.stringify(evidence, null, 2) + '\n');
          NODE
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-quality-${{ github.sha }}-${{ matrix.scenario }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kras-qa-source.json
            ${{ runner.temp }}/godot-import.stdout
            ${{ runner.temp }}/kras-server-tests.stdout
            ${{ runner.temp }}/kras-server-capture-tests.stdout
            ${{ runner.temp }}/kras-network-*.stdout
            ${{ runner.temp }}/kras-network-smoke-*/*.stdout
            ${{ runner.temp }}/kras-network-smoke-*/*.log
            ${{ runner.temp }}/kras-network-smoke-*/server-timing.json
            ${{ runner.temp }}/kras-party-check.*/*.stdout
            ${{ runner.temp }}/kras-party-check.*/saves-tests/armed-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-tests/siege-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-tests/forge-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-tests/dreadnought-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-tests/sovereign-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-tests/colossus-world.json
            ${{ runner.temp }}/kras-party-check.*/saves-stability/stability.json
            build/stage0/inventory.json
