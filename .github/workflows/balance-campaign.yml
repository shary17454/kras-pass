name: Natural Balance Campaign

on:
  workflow_dispatch:
    inputs:
      seed_offset:
        description: Reproducible independent seed offset (0 to 1000000000)
        type: string
        default: '0'
  workflow_call:
    inputs:
      seed_offset:
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: balance-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    needs: [catalogue, simulation]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Qualify all campaign evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEED_OFFSET: ${{ inputs.seed_offset || '0' }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --pattern 'natural-balance-*' --dir "$RUNNER_TEMP/balance-evidence"
          node tools/balance-report.mjs "$RUNNER_TEMP/balance-evidence" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            --paired --seed-offset="$SEED_OFFSET" \
            | tee "$RUNNER_TEMP/balance-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: campaign-summary
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/balance-summary.json

  catalogue:
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.catalogue.outputs.games }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: catalogue
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const games = JSON.parse(fs.readFileSync('data/minigames.json', 'utf8')).games.map(game => game.id);
          if (games.length < 39 || new Set(games).size !== games.length || games.some(id => !/^[a-z0-9_]+$/.test(id))) {
            throw new Error('Invalid balance catalogue');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `games=${JSON.stringify(games)}\n`);
          JS

  simulation:
    needs: catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ${{ fromJSON(needs.catalogue.outputs.games) }}
    env:
      GODOT_VERSION: 4.7.1
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      GAME_ID: ${{ matrix.game }}
      SEED_OFFSET: ${{ inputs.seed_offset || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified Godot
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --max-time 300 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import and check policy
        run: |
          set -euo pipefail
          godot --headless --path . --import --log-file "$RUNNER_TEMP/balance-import.log" \
            -- --test-data-dir="$RUNNER_TEMP/balance-import-save" 2>&1 | tee "$RUNNER_TEMP/balance-import.stdout"
          sh tools/check_godot_log.sh "$RUNNER_TEMP/balance-import.stdout" import
          godot --headless --fixed-fps 60 --path . tests/test_runner.tscn \
            --log-file "$RUNNER_TEMP/balance-policy.log" \
            -- --suite=balance_sim --test-data-dir="$RUNNER_TEMP/balance-policy-save" 2>&1 | tee "$RUNNER_TEMP/balance-policy.stdout"
          sh tools/check_godot_log.sh "$RUNNER_TEMP/balance-policy.stdout" tests
      - name: Complete natural matches
        run: |
          set -euo pipefail
          godot --headless --fixed-fps 60 --path . tools/balance_sim.tscn \
            --log-file "$RUNNER_TEMP/balance-simulation.log" \
            -- --runs=24 --only="$GAME_ID" --seed-offset="$SEED_OFFSET" --out-dir="$RUNNER_TEMP/balance-report" \
            --test-data-dir="$RUNNER_TEMP/balance-save" 2>&1 | tee "$RUNNER_TEMP/balance-simulation.stdout"
          sh tools/check_godot_log.sh "$RUNNER_TEMP/balance-simulation.stdout"
      - name: Verify report coverage
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { verifyBossOutcomeEvidence } from './tools/balance-report.mjs';
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/balance-report/report.json`, 'utf8'));
          const game = report.games[0];
          const smoke = report.mutator_smoke[0];
          const offset = Number(process.env.SEED_OFFSET);
          if (report.sample_mode !== 'natural' || report.games.length !== 1 || game.id !== process.env.GAME_ID ||
              !Number.isSafeInteger(offset) || offset < 0 || offset > 1000000000 ||
              report.seed_offset !== offset || game.seed_offset !== offset ||
              game.attempted_runs !== 24 || game.runs !== 24 || game.difficulty_attempted !== 16 ||
              game.difficulty_completed !== 16 || game.difficulty_pairing !== 'matched_seed_character' ||
              !smoke.mutated_ok || !smoke.chaos_ok) {
            throw new Error('Incomplete balance campaign coverage');
          }
          const catalogue = JSON.parse(fs.readFileSync('data/minigames.json', 'utf8'));
          if (catalogue.games.some(def => def.id === game.id && def.boss === true)) {
            verifyBossOutcomeEvidence(game, offset);
          }
          JS
      - name: Record source evidence
        if: always()
        env:
          QA_COMMIT: ${{ github.sha }}
          QA_RUN: ${{ github.run_id }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/balance-checkout.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/balance-source.json`, JSON.stringify({
            commit: process.env.QA_COMMIT, run: process.env.QA_RUN, game: process.env.GAME_ID,
            runs: 24, difficultyRuns: 16, difficultyPolicy: 'matched_seed_character', smokeRuns: 2, mode: 'natural',
            seedOffset: Number(process.env.SEED_OFFSET)
          }, null, 2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: natural-balance-${{ matrix.game }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/balance-*.log
            ${{ runner.temp }}/balance-checkout.txt
            ${{ runner.temp }}/balance-source.json
            ${{ runner.temp }}/balance-report/
            ${{ runner.temp }}/balance-save/balance_progress.txt
