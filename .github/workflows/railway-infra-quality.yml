name: Railway Infrastructure Quality

on:
  pull_request:
    paths: [".railway/**", "package.json", "package-lock.json", "railway.json", ".github/workflows/railway-infra-quality.yml"]
  push:
    branches: [main]
    paths: [".railway/**", "package.json", "package-lock.json", "railway.json", ".github/workflows/railway-infra-quality.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:infra
